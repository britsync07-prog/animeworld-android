name: Build AnimeWorld Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js (for React PWA build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React PWA frontend
        working-directory: android-app/frontend
        run: |
          npm install
          npm run build

      - name: Bundle frontend into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r android-app/frontend/dist/* android-app/app/src/main/assets/www/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Gradle 8.6
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
